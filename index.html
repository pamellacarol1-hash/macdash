<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Áreas</title>
<style>
  :root {
    --ink: #1C1C1A;
    --pessoal: #FF87D5;
    --medicina: #D9DA51;
    --formatura: #EC5F3F;
    --comissao: #F09947;
    --residencia: #8F91E0;
    --faculdade: #8F8E49;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 3px 0;
  }

  .areas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
    gap: 9px;
    width: 100%;
  }

  .area-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.25px;
    color: inherit;
    text-decoration: none;
  }

  .area {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 15px;
    width: 100%;
    height: 112.5px;
    min-height: 112.5px;
    padding: 21px 24px 19.5px;
    border-radius: 0;
    color: var(--ink);
    text-decoration: none;
    background-color: var(--tint);
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    will-change: transform;
  }

  .area__label {
    display: block;
    width: 100%;
    padding: 2.25px 4.5px;
    border: 1px solid var(--tint);
    color: var(--tint);
    background: #fff;
    font-family: sans-serif;
    font-size: 13.5px;
    text-transform: uppercase;
    line-height: 1.2;
    text-align: center;
  }

  .area-item:hover .area {
    transform: translateY(-1.5px);
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 4.5px 12px rgba(0,0,0,.10);
    filter: saturate(1.04);
  }

  .area-item:active .area { transform: translateY(0); }

  .area-item:focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2.25px;
  }

  .area--pessoal    { --tint: var(--pessoal); }
  .area--medicina   { --tint: var(--medicina); }
  .area--formatura  { --tint: var(--formatura); }
  .area--comissao   { --tint: var(--comissao); }
  .area--residencia { --tint: var(--residencia); }
  .area--faculdade  { --tint: var(--faculdade); }

  .area-item:has(.area--pessoal) { --tint: var(--pessoal); }
  .area-item:has(.area--medicina) { --tint: var(--medicina); }
  .area-item:has(.area--formatura) { --tint: var(--formatura); }
  .area-item:has(.area--comissao) { --tint: var(--comissao); }
  .area-item:has(.area--residencia) { --tint: var(--residencia); }
  .area-item:has(.area--faculdade) { --tint: var(--faculdade); }

  @media (max-width: 390px) {
    .areas { gap: 7.5px; }
    .area { min-height: 112.5px; padding: 18px 19.5px 16.5px; gap: 21px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .area { transition: none; }
    .area-item:hover .area { transform: none; }
  }
</style>
</head>
<body>
  <nav class="areas" aria-label="Áreas do Notion">
    <a class="area-item" id="Pessoal" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--pessoal" aria-hidden="true"></div>
      <span class="area__label">Pessoal</span>
    </a>
    <a class="area-item" id="Medicina" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--medicina" aria-hidden="true"></div>
      <span class="area__label">Medicina</span>
    </a>
    <a class="area-item" id="Formatura" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--formatura" aria-hidden="true"></div>
      <span class="area__label">Formatura</span>
    </a>
    <a class="area-item" id="Comissão" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--comissao" aria-hidden="true"></div>
      <span class="area__label">Comissão</span>
    </a>
    <a class="area-item" id="Residência" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--residencia" aria-hidden="true"></div>
      <span class="area__label">Residência</span>
    </a>
    <a class="area-item" id="Faculdade" href="#" onclick="navigate(this.id); return false;">
      <div class="area area--faculdade" aria-hidden="true"></div>
      <span class="area__label">Faculdade</span>
    </a>
  </nav>
  <script>
    function navigate(id) {
      const pages = {
        Pessoal: "https://app.notion.com/p/med26/Pessoal-4096f65f7fbd8018a473faf770510edf?source=copy_link",
        Medicina: "https://app.notion.com/p/med26/Medicina-4096f65f7fbd80bf9d7bf1532faf718e?source=copy_link",
        Formatura: "https://app.notion.com/p/med26/Formatura-4096f65f7fbd801fa5f0c2d2753af7ca?source=copy_link",
        "Comissão": "https://app.notion.com/p/med26/Comiss-o-4096f65f7fbd80ae9b40ed92b902bf92?source=copy_link",
        "Residência": "https://app.notion.com/p/med26/Resid-ncia-4096f65f7fbd801f9504f67509a1c11e?source=copy_link",
        Faculdade: "https://app.notion.com/p/med26/Faculdade-4096f65f7fbd80568296e1a040c4c066?source=copy_link"
      };

      if (pages[id]) window.open(pages[id], "_blank").focus();
    }
  </script>
</body>
</html>
